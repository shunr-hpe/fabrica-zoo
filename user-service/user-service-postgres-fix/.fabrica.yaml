project:
    name: user-service-postgres-fix
    module: github.com/openchami/user-service-postgres-fix
    created: 2026-11-17T11:56:04.0912333-07:00
features:
    validation:
        enabled: true
        mode: strict
    events:
        enabled: false
        bus_type: memory
    conditional:
        enabled: true
        etag_algorithm: sha256
