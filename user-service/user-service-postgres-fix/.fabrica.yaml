        enabled: false
    storage:
        enabled: true
        type: ent
        db_driver: postgres
    metrics:
        enabled: false
        provider: prometheus
    reconciliation:
        enabled: false
        worker_count: 5
        requeue_delay: 5
    security:
        authn:
            enabled: false
        authz:
            enabled: false
            mode: enforce
generation:
    handlers: true
    storage: true
    client: true
    openapi: true
    events: false
    middleware: true
    reconciliation: false
